# ---------- Server ----------
# The React app calls "/api/..." and Vite proxies it to http://localhost:7169 (see frontend .env.development)
server.port=7169
server.servlet.context-path=/api

# ---------- MySQL (XAMPP defaults: user root, empty password) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/dental_clinic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=uploads

# ---------- JWT (change the secret for anything beyond a demo; must be >= 32 chars) ----------
app.jwt.secret=swaminarayan-dental-clinic-demo-secret-key-change-me-2026
app.jwt.access-expiry-minutes=720
app.jwt.refresh-expiry-days=7

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:9432,http://127.0.0.1:9432,http://localhost:5173

# ---------- Default admin + starter master data (created only if missing) ----------
app.seed.admin-username=admin
app.seed.admin-email=admin@swaminarayan.com
app.seed.admin-password=Admin@123
app.seed.master-data=true
